<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#091020"/>
  
  <!-- Subtle Grid Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#152037" stroke-width="1"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="600" cy="300" r="400" fill="url(#glow)" filter="blur(80px)" />

  <!-- Content Container -->
  <g transform="translate(140, 160)">
    <!-- Logo Icon -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="url(#brandGrad)"/>
    <polygon points="40,22 62,60 18,60" fill="#091020" stroke="#22d3ee" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- Title -->
    <text x="110" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-0.03em">TEXY<tspan fill="#3b82f6">.</tspan></text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="150" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" fill="#f8fafc" letter-spacing="-0.02em">
      All-in-One Online Developer &amp; Text Tools
    </text>
    
    <text x="0" y="210" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#94a3b8">
      Manipulasi teks, pembersihan data, konversi, format code, dan utilitas instan di browser.
    </text>

    <!-- Badges -->
    <g transform="translate(0, 270)">
      <rect x="0" y="0" width="160" height="42" rx="10" fill="#111a2f" stroke="#1e2e50" stroke-width="1.5"/>
      <text x="80" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">⚡ 100% Gratis</text>

      <rect x="180" y="0" width="180" height="42" rx="10" fill="#111a2f" stroke="#1e2e50" stroke-width="1.5"/>
      <text x="270" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">🔒 Tanpa Login</text>

      <rect x="380" y="0" width="200" height="42" rx="10" fill="#111a2f" stroke="#1e2e50" stroke-width="1.5"/>
      <text x="480" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8" text-anchor="middle">💻 Diproses Lokal</text>
    </g>
  </g>
</svg>

